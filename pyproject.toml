[project]
name = "potato-trial-pipeline"
requires-python = ">=3.10,<3.14"
version = "0.1.0"

dependencies = [
    "dagster==1.13.25",
    "dagster-dlt==0.29.25",
    "dlt[duckdb]==1.30.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "dbt==2.0.8",
    "dagster-dbt==0.29.25",
    "dbt-duckdb==1.11.0"
]

[project.optional-dependencies]
dev = [
    "dagster-dg-cli==1.13.25",
    "dagster-webserver==1.13.25",
    "pytest==9.1.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "potato_trial_pipeline"
registry_modules = [
    "potato_trial_pipeline.components.*",
]


